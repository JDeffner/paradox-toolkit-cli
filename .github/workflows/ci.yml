name: Check CLI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.22.2, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Diagnose Linux process visibility
        if: runner.os == 'Linux'
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import * as fs from 'node:fs/promises';
          const statInfo = (s) => ({ uid: s.uid, gid: s.gid, dev: s.dev, ino: s.ino, mode: s.mode });
          for (const pid of await fs.readdir('/proc')) {
            if (!/^\d+$/.test(pid)) continue;
            const exe = `/proc/${pid}/exe`;
            try {
              const link = await fs.lstat(exe);
              if (link.uid !== process.getuid()) continue;
              try { await fs.realpath(exe); } catch (error) {
                if (error.code !== 'EACCES' && error.code !== 'EPERM') continue;
                const result = { pid, uid: process.getuid(), link: statInfo(link), realpath: error.code };
                for (const [name, read] of Object.entries({
                  directory: () => fs.stat(`/proc/${pid}`).then(statInfo),
                  comm: () => fs.readFile(`/proc/${pid}/comm`, 'utf8'),
                  readlink: () => fs.readlink(exe),
                  stat: () => fs.stat(exe).then(statInfo),
                })) {
                  try { result[name] = await read(); } catch (error) { result[name] = error.code; }
                }
                console.log(JSON.stringify(result));
              }
            } catch (error) {
              if (error.code !== 'ENOENT' && error.code !== 'ESRCH') throw error;
            }
          }
          JS
      - run: pnpm install --frozen-lockfile
      - run: pnpm run compile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm pack --pack-destination .local/artifacts
      - name: Installed package
        shell: bash
        run: pnpm test:package .local/artifacts/px-lsp-cli-*.tgz
