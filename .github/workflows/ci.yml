name: Check CLI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.22.2, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run compile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - name: Tests (Windows)
        if: runner.os == 'Windows'
        run: pnpm test
      - name: Tests (Linux, isolated process namespace)
        if: runner.os == 'Linux'
        # The host user systemd can deny /proc access. Keep that refusal in
        # production; launch fixtures need a controlled, inspectable process set.
        run: sudo --preserve-env unshare --pid --fork --mount-proc --kill-child runuser --preserve-environment -u "$(id -un)" -- env "PATH=$PATH" pnpm test
      - run: pnpm pack --pack-destination .local/artifacts
      - name: Installed package
        shell: bash
        run: pnpm test:package .local/artifacts/pxtk-cli-*.tgz
